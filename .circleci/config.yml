version: 2.1
jobs:
  compile:
    docker:
      - image: sandatjepil/build:jammy
    steps:
      - checkout
      - run:
          name: Kernel 4.14.x
          shell: /bin/bash
          command: |
            git clone -qb stable --recursive --depth 1 https://github.com/PurrrsLitterbox/android_kernel_sweet kernel
            bash build.sh
          no_output_timeout : 1h
workflows:
  version: 2.1
  cooking:
    jobs:
      - compile