version: 2.1
jobs:
  compile:
    docker:
      - image: debian:trixie-slim
    steps:
      - run:
          shell: /bin/bash
          command: |
            apt update && apt upgrade -y && apt install bc build-essential bison flex zip tar zstd libc6 libstdc++6 git curl wget libssl-dev lld openjdk-21-jdk -y
            git clone -qb zeus --recursive --depth 15 https://github.com/sandatjepil/asus_kernel_sdm636.git kernel
            curl -sL https://raw.githubusercontent.com/sandatjepil/cooking-kernel/sky/build.sh | bash
          no_output_timeout : 1h
workflows:
  version: 2.1
  cooking:
    jobs:
      - compile