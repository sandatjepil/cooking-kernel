version: 2.1
jobs:
  compile:
    docker:
      - image: xyzuan/xdocker:latest
    steps:
      - run:
          shell: /bin/bash
          command: |
            git clone --recursive --depth 15 https://github.com/sandatjepil/asus_kernel_sdm636.git -b r42 kernel
            bash build.sh
          no_output_timeout : 1h
workflows:
  version: 2.1
  cooking:
    jobs:
      - compile