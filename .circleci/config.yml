version: 2.1
jobs:
  compile:
    docker:
      - image: wizardprjkt/build:kernel
    steps:
      - run:
          shell: /bin/bash
          command: |
            git clone -qb cip --recursive --depth 15 https://github.com/PurrrsLitterbox/x00td_kernel_4.19.git kernel
            curl -sL https://raw.githubusercontent.com/sandatjepil/cooking-kernel/miracle/build.sh | bash
          no_output_timeout : 1h
workflows:
  version: 2.1
  cooking:
    jobs:
      - compile