version: 2.1
jobs:
  compile:
    docker:
      - image: debian:trixie
    steps:
      - run:
          shell: /bin/bash
          command: |
            apt update && apt upgrade -y && DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends bc build-essential bison flex zip tar zstd libc6 libstdc++6 git curl wget libssl-dev lld openjdk-21-jdk tzdata -y
            git clone -qb tom --recursive --depth 15 https://github.com/PurrrsLitterbox/x00td_kernel_4.19.git kernel
            curl -sL https://raw.githubusercontent.com/sandatjepil/cooking-kernel/miracle/build.sh | bash
          no_output_timeout : 1h
workflows:
  version: 2.1
  cooking:
    jobs:
      - compile